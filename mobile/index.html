<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mintygreen Charges</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f5548">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MG Charges">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root{--g:#176b5b;--g2:#0f5548;--mint:#eaf6f3;--bg:#f4f7f6;--text:#20302c;--muted:#6c7a76;--border:#dbe4e1;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:var(--g2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--g2);display:grid;place-items:center;font-weight:900}.brand{font-weight:850}.brand small{display:block;font-size:11px;font-weight:500;opacity:.8}.spacer{flex:1}
main{max-width:620px;margin:auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800}.primary{background:var(--g);color:#fff}.light{background:#fff;color:var(--g2);border:1px solid var(--border)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #c9d5d1;border-radius:10px;background:#fff;font-size:16px}
.login{max-width:420px;margin:8vh auto}.login h1{text-align:center;margin:8px 0 4px}.sub{text-align:center;color:var(--muted);margin-bottom:18px}.note{font-size:12px;color:var(--muted);line-height:1.5}.err{color:var(--red)}
.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}.date{padding:12px;text-align:center;border:1px solid var(--border);border-radius:10px;font-weight:850}.today{text-align:center;margin-top:8px}
.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--mint);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:12px}.summary strong{font-size:16px}
.category{font-size:12px;font-weight:900;background:#edf3f1;padding:9px 11px;border:1px solid var(--border);border-radius:10px 10px 0 0;margin-top:12px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--border);border-top:0;padding:12px}.item:last-child{border-radius:0 0 10px 10px}.item strong{display:block;font-size:14px}.item small{color:var(--muted)}
.step{display:grid;grid-template-columns:44px 50px 44px;gap:6px}.step button,.step input{height:44px;border:1px solid var(--border);border-radius:10px;background:#fff;text-align:center;font-weight:850}.step button{font-size:21px}.step input{width:50px;font-size:16px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--border);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:12}.saveinner{max-width:620px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.status{font-size:12px;color:var(--muted)}
.topbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:9px;padding:8px 10px;font-weight:800}.captcha{display:flex;justify-content:center;margin:10px 0}
.install{width:100%;margin-bottom:12px}
.logo{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mobile-nav{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:68px;z-index:8;background:var(--bg);padding:4px 0 6px}
.mobile-nav .navbtn{flex:1;background:#fff;color:var(--g2);border:1px solid var(--border);border-radius:10px;padding:10px 8px;font-weight:850}
.mobile-nav .navbtn.active{background:var(--g);color:#fff;border-color:var(--g)}
.saved-ok{color:var(--g);font-weight:800}
.settings-card h3{margin:0 0 12px}.account-email{font-weight:800;overflow-wrap:anywhere}
@media(min-width:700px){body:before{content:"Mobile Staff App";position:fixed;right:12px;bottom:12px;color:#94a3a0;font-size:11px}}
</style>
</head>
<body>
<section id="loginView">
<main><div class="card login">
<div class="logo" style="margin:auto">MG</div><h1>Mintygreen Healthcare</h1><div class="sub">Mobile Daily Entry</div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
<div id="turnstile" class="captcha"></div>
<button id="loginBtn" class="btn primary" style="width:100%">Log in</button>
<p id="loginMsg" class="note"></p>
</div></main>
</section>

<section id="appView" class="hidden">
<header><div class="logo">MG</div><div class="brand">Mintygreen Charges<small id="branchName">Daily Entry</small></div><div class="spacer"></div></header>
<main>
<div class="mobile-nav">
  <button id="entryNavBtn" class="navbtn active">Daily Entry</button>
  <button id="settingsNavBtn" class="navbtn">Settings</button>
  <button id="logoutBtn" class="navbtn">Log out</button>
</div>
<div id="dailyScreen">
<button id="installBtn" class="btn primary install hidden">Install Mintygreen Charges</button>
<div class="card">
<div class="field"><label>Resident</label><select id="resident"></select></div>
<div class="datebar"><button id="prev" class="btn light">‹</button><div id="dateText" class="date">-</div><button id="next" class="btn light">›</button></div>
<div class="today"><button id="today" class="btn light">Today</button></div>
</div>
<div id="existing" class="summary hidden"><div><span class="note">Already entered</span><div id="existingList"></div></div><strong id="dayTotal">RM 0.00</strong></div>
<div id="items"></div>
</div>
<div id="settingsScreen" class="hidden">
  <div class="card settings-card">
    <h3>Account</h3>
    <div class="note">Signed in as</div>
    <div id="accountEmail" class="account-email">-</div>
  </div>
  <div class="card">
    <strong>Mintygreen Charges</strong>
    <p class="note">Mobile Daily Entry · Same Mintygreen billing database</p>
    <button id="settingsInstallBtn" class="btn primary" style="width:100%">Install App</button>
  </div>
</div>
</main>
<div class="savebar"><div class="saveinner"><div><strong id="count">0 entries</strong><div id="status" class="status">Select a resident.</div></div><strong id="total">RM 0.00</strong></div></div>
</section>

<script>
const SUPABASE_URL='https://qppkqopbtaswfwspjxsc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_VpqWrjBfc0XoawJ8CGYrcw_GdGL4bPy';
const TURNSTILE_SITE_KEY='0x4AAAAAAEv94I2iOlANwtYM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id), money=n=>'RM '+Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
let user=null,profile=null,branchId=null,residents=[],itemList=[],entries=[],selectedDate=iso(new Date()),locked=false,turnstileId=null,captchaToken=null,deferredPrompt=null;

function renderTurnstile(){if(!window.turnstile){setTimeout(renderTurnstile,250);return}if(turnstileId!==null)return;turnstileId=window.turnstile.render('#turnstile',{sitekey:TURNSTILE_SITE_KEY,callback:t=>captchaToken=t,'expired-callback':()=>captchaToken=null})}
function resetCaptcha(){captchaToken=null;if(window.turnstile&&turnstileId!==null)try{window.turnstile.reset(turnstileId)}catch{}}
$('loginBtn').onclick=async()=>{const btn=$('loginBtn'),email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('loginMsg').textContent='Enter email and password.';if(!captchaToken)return $('loginMsg').textContent='Complete the security verification.';btn.disabled=true;btn.textContent='Logging in…';const {data,error}=await sb.auth.signInWithPassword({email,password,options:{captchaToken}});if(error){$('loginMsg').textContent=error.message;btn.disabled=false;btn.textContent='Log in';resetCaptcha();return}location.reload()};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
function showMobileScreen(screen){
 const daily=screen==='daily';
 $('dailyScreen').classList.toggle('hidden',!daily);
 $('settingsScreen').classList.toggle('hidden',daily);
 $('entryNavBtn').classList.toggle('active',daily);
 $('settingsNavBtn').classList.toggle('active',!daily);
}
$('entryNavBtn').onclick=()=>showMobileScreen('daily');
$('settingsNavBtn').onclick=()=>showMobileScreen('settings');

async function start(u){
 user=u;
 const {data:p,error:pe}=await sb.from('profiles').select('id,email,role,branch_id').eq('id',u.id).single();
 if(pe||!p?.branch_id){await sb.auth.signOut();$('loginMsg').textContent='This account is not assigned to a branch.';return}
 profile=p;branchId=p.branch_id;$('accountEmail').textContent=u.email||p.email||'-';
 $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
 const [{data:r,error:re},{data:i,error:ie},{data:b}] = await Promise.all([
  sb.from('residents').select('*').eq('active',true).eq('branch_id',branchId).order('name'),
  sb.from('items').select('*').eq('active',true).eq('branch_id',branchId).order('sort_order').order('name'),
  sb.from('branches').select('name').eq('id',branchId).maybeSingle()
 ]);
 if(re||ie){$('status').textContent=(re||ie).message;return}
 residents=r||[];itemList=i||[];$('branchName').textContent=(b?.name||'Branch')+' · Daily Entry';
 $('resident').innerHTML='<option value="">Select resident...</option>'+residents.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 renderDate();renderItems();
}
function cycleForDate(dateStr){const d=new Date(dateStr+'T00:00:00');const y=d.getFullYear(),m=d.getMonth()+1;let by,bm;if(d.getDate()>=25){by=m===12?y+1:y;bm=m===12?1:m+1}else{by=y;bm=m}const billing=`${by}-${String(bm).padStart(2,'0')}`;let sy=by,sm=bm-1;if(sm===0){sm=12;sy--}return {billing,start:`${sy}-${String(sm).padStart(2,'0')}-25`,end:`${by}-${String(bm).padStart(2,'0')}-24`}}
async function checkLock(){const c=cycleForDate(selectedDate);const {data}=await sb.from('billing_cycle_locks').select('locked').eq('billing_month',c.billing).eq('branch_id',branchId).maybeSingle();locked=!!data?.locked}
function renderDate(){$('dateText').textContent=new Date(selectedDate+'T00:00:00').toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'})}
function grouped(){const m=new Map;itemList.forEach(i=>{const c=i.category||'Other';if(!m.has(c))m.set(c,[]);m.get(c).push(i)});return [...m.entries()]}
async function loadDay(){const rid=$('resident').value;renderDate();if(!rid){entries=[];renderItems();return} $('status').textContent='Loading…';await checkLock();const {data,error}=await sb.from('charge_entries').select('*').eq('resident_id',rid).eq('charge_date',selectedDate);if(error){$('status').textContent=error.message;return}entries=data||[];renderItems()}
function renderItems(){
 let count=0,total=0,existing=[];
 $('items').innerHTML=grouped().map(([cat,list])=>`<div class="category">${esc(cat)}</div>`+list.map(it=>{const e=entries.find(x=>x.item_id===it.id),q=e?Number(e.quantity):0,amt=q*Number(e?.unit_price??it.price??0);if(q>0){count++;total+=amt;existing.push(`${esc(it.name)} × ${q}`)}return `<div class="item"><div><strong>${esc(it.name)}</strong><small>${esc(it.unit||'')}${it.price==null?'':' · '+money(it.price)}</small></div><div class="step"><button ${locked?'disabled':''} onclick="changeQty('${it.id}',-1)">−</button><input ${locked?'disabled':''} type="number" min="0" step="1" value="${q||''}" data-id="${it.id}" onchange="inputQty(this)"><button ${locked?'disabled':''} onclick="changeQty('${it.id}',1)">+</button></div></div>`}).join('')).join('');
 $('count').textContent=`${count} ${count===1?'entry':'entries'}`;$('total').textContent=money(total);$('dayTotal').textContent=money(total);
 $('existing').classList.toggle('hidden',!existing.length);$('existingList').innerHTML=existing.map(x=>`<div>${x}</div>`).join('');
 $('status').textContent=locked?'Billing cycle is locked.':($('resident').value?'All changes save automatically.':'Select a resident.');
}
async function save(itemId,qty){
 const rid=$('resident').value;if(!rid)return; if(locked)return;
 const it=itemList.find(x=>x.id===itemId);if(!it)return;qty=Math.max(0,Number(qty||0));const e=entries.find(x=>x.item_id===itemId);$('status').textContent='Saving…';let error;
 if(qty<=0&&e)({error}=await sb.from('charge_entries').delete().eq('id',e.id));
 else if(qty>0){const payload={resident_id:rid,item_id:itemId,charge_date:selectedDate,quantity:qty,unit_price:Number(it.price||0),updated_by:user.id,branch_id:branchId};if(e)({error}=await sb.from('charge_entries').update(payload).eq('id',e.id));else({error}=await sb.from('charge_entries').insert({...payload,created_by:user.id}))}
 if(error){$('status').textContent=error.message;return}
 await loadDay();
 const savedTime=new Date().toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'});
 $('status').innerHTML='<span class="saved-ok">✓ Saved · '+savedTime+'</span>';
}
window.changeQty=(id,d)=>{const e=entries.find(x=>x.item_id===id);save(id,(e?Number(e.quantity):0)+d)};
window.inputQty=el=>save(el.dataset.id,el.value);
$('resident').onchange=loadDay;
function shift(n){const d=new Date(selectedDate+'T00:00:00');d.setDate(d.getDate()+n);selectedDate=iso(d);loadDay()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{selectedDate=iso(new Date());loadDay()};

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden')});
async function promptInstall(){
 if(!deferredPrompt){alert('If Install App is not offered, use your browser menu. On iPhone: Share → Add to Home Screen.');return}
 deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.add('hidden');
}
$('installBtn').onclick=promptInstall;
$('settingsInstallBtn').onclick=promptInstall;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');

(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)start(session.user);else renderTurnstile()})();
</script>
</body>
</html>
