<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — MG Bayan Lepas</title>
  <meta name="theme-color" content="#0f5548">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--green:#176b5b;--mint:#eaf6f3;--bg:#f4f7f6;--card:#fff;--text:#20302c;--muted:#6c7a76;--border:#dbe4e1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 12px 34px rgba(25,70,60,.10)}
    .icon{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--mint);color:var(--green);font-size:38px;font-weight:800}
    h1{margin:0 0 10px;font-size:25px}
    p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
    button{display:inline-block;padding:11px 18px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;cursor:pointer;font:inherit}button:disabled{opacity:.65;cursor:wait}
    .small{font-size:12px;margin-top:18px;margin-bottom:0}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <h1>Email confirmation successful</h1>
    <p>
      Your confirmation has been received. If Secure Email Change is enabled,
      please complete the confirmation sent to the other email address as well.
      Once both confirmations are completed, use your new email address to sign in.
    </p>
    <button id="returnBtn" type="button">Return to MG Bayan Lepas</button>
    <p class="small">You can safely close this page.</p>
  </main>
<script>
    const SUPABASE_URL = 'https://qppkqopbtaswfwspjxsc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VpqWrjBfc0XoawJ8CGYrcw_GdGL4bPy';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('returnBtn').addEventListener('click', async () => {
      const btn = document.getElementById('returnBtn');
      btn.disabled = true;
      btn.textContent = 'Returning…';

      try {
        await sb.auth.signOut();
      } catch (err) {
        console.warn('Could not sign out cleanly:', err);
      }

      // Always return to a fresh login page so the old email/session
      // cannot remain visible after an email change.
      window.location.replace('https://minty-green.github.io/Charges/');
    });
  </script>
</body>
</html>
